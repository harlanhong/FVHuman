wandb_project: 'vfi'
exp_name: 'oliver-512-4-16'

wandb_entity: 'liu1997'
wandb_key: "91fe156c60374c4eb00dd6a990017b0371e32737"
wandb_log_dir: '/mnt/localssd/outputs/wandb'
output_dir: '/sensei-fs/users/haiyangl/diffusion_weights'

seed: 42
resume_from_checkpoint: ''
base_model_path: '/mnt/localssd/pretrained_weights/stable-diffusion-v1-5'
vae_model_path: '/mnt/localssd/pretrained_weights/sd-vae-ft-mse'
image_encoder_path: '/mnt/localssd/pretrained_weights/image_encoder'
controlnet_openpose_path: '/mnt/localssd/pretrained_weights/control_v11p_sd15_openpose/diffusion_pytorch_model.bin'
pose_guider_pretrain: False
mm_path: './pretrained_models/mm_sd_v15_v2.ckpt'

data:
  train_bs: 1
  meta_paths:
    - "/sensei-fs/users/haiyangl/pose2video/data/oliver_both_768_99_1_meta.json"
  image_size: 512
  aug_type: "RandomResizeCrop" # centercrop
  sample_frames: 14
  sample_rate: 1
  seed_frames: 3
  generated_frames: 8

validation:
  val_loss_steps: 250
  validation_steps: 1000
  guidance_scale: 3.5
  denoising_steps: 20 

solver:
  gradient_accumulation_steps: 1
  mixed_precision: 'fp16'
  enable_xformers_memory_efficient_attention: True 
  gradient_checkpointing: False 
  max_train_steps: 500000
  max_grad_norm: 1.0
  # lr
  learning_rate: 1e-5
  scale_lr: False 
  lr_warmup_steps: 1
  lr_scheduler: 'constant'

  # optimizer
  use_8bit_adam: True 
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay:  1.0e-2
  adam_epsilon: 1.0e-8

noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start:          0.00085
  beta_end:            0.012
  beta_schedule:       "linear"
  steps_offset:        1
  clip_sample:         false

guidance_encoder_kwargs:
  guidance_embedding_channels: 320
  guidance_input_channels: 3
  block_out_channels: [16, 32, 96, 256]

unet_additional_kwargs:
  use_inflated_groupnorm: true
  unet_use_cross_frame_attention: false 
  unet_use_temporal_attention: false
  use_motion_module: true
  motion_module_resolutions:
  - 1
  - 2
  - 4
  - 8
  motion_module_mid_block: true 
  motion_module_decoder_only: false
  motion_module_type: Vanilla
  motion_module_kwargs:
    num_attention_heads: 8
    num_transformer_block: 1
    attention_block_types:
    - Temporal_Self
    - Temporal_Self
    temporal_position_encoding: true
    temporal_position_encoding_max_len: 32
    temporal_attention_dim_div: 1

weight_dtype: 'fp16'  # [fp16, fp32]
uncond_ratio: 0.1
noise_offset: 0.05
snr_gamma: 5.0
enable_zero_snr: True
